name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.7.2

      - name: Run lint
        run: |
          golangci-lint version
          golangci-lint run --timeout=5m

  fmt-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Check formatting
        run: make fmt-check

  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24', '1.25']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: make test

      - name: Check coverage threshold
        run: |
          # Calculate coverage excluding main and mocks
          COVERAGE=$(go tool cover -func=coverage.out | grep -v "mocks/" | grep -v "cmd/vanish/" | awk '{if (NF==3) {sum+=$3; count++}} END {printf "%.1f", sum/count}')
          echo "Current coverage: ${COVERAGE}%"
          
          # Check if coverage is at least 80%
          if (( $(echo "$COVERAGE < 80.0" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below the required 80% threshold"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets the 80% threshold"
          fi
