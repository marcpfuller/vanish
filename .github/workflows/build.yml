name: Build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build All Platforms
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            goos: linux
            goarch: amd64
            ext: ""
          - os: windows
            goos: windows
            goarch: amd64
            ext: ".exe"
          - os: macos-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - os: macos-arm64
            goos: darwin
            goarch: arm64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download dependencies
        run: go mod download

      - name: Build (Pure Go - no CGO needed!)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          go build -ldflags="-s -w" -o bin/vanish-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/vanish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanish-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/vanish-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          compression-level: 9

  package:
    name: Package All Binaries
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Create release zip
        run: |
          cd binaries
          zip -r ../vanish-all-platforms.zip .

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanish-all-platforms
          path: vanish-all-platforms.zip
          retention-days: 30
