name: Build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - os: windows
            runner: ubuntu-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
          - os: macos
            runner: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install MinGW (for Windows cross-compile)
        if: matrix.os == 'windows'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: |
          mkdir -p bin
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          CGO_ENABLED=1 CGO_LDFLAGS="-lm" \
          ${{ matrix.os == 'windows' && 'CC=x86_64-w64-mingw32-gcc' || '' }} \
          go build -ldflags="-s -w" -o bin/vanish-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanish-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/vanish-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          compression-level: 9

  package:
    name: Package All Binaries
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Create release zip
        run: |
          cd binaries
          zip -r ../vanish-all-platforms.zip .

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanish-all-platforms
          path: vanish-all-platforms.zip
          retention-days: 30
