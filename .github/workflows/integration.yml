name: Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download dependencies
        run: go mod download

      - name: Build test Docker images
        run: make test-integration-build

      - name: Run integration tests (basic)
        run: |
          # Run basic tests that don't require Tailscale
          go test -v -tags=integration ./test/integration/... -run TestIntegration_NASContainerBasics -timeout=5m
          go test -v -tags=integration ./test/integration/... -run TestIntegration_ParallelContainers -timeout=5m

      - name: Run integration tests (with Tailscale)
        if: ${{ secrets.TS_TEST_AUTHKEY != '' }}
        env:
          TS_TEST_AUTHKEY: ${{ secrets.TS_TEST_AUTHKEY }}
        run: make test-integration
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            test/integration/*.log
            coverage.out
